```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LISTEN GTA SAN ANDREAS THEME SONG!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101010, #292929);
    color: white;
}

.player {
    width: 92%;
    max-width: 430px;
    padding: 30px 25px;
    background: #1d1d1d;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.6);
}

.cover {
    width: 140px;
    height: 140px;
    margin: auto;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    background: linear-gradient(135deg, #6a5cff, #b000ff);
}

h1 {
    margin: 20px 0 5px;
    font-size: 25px;
}

.artist {
    color: #aaa;
    margin-bottom: 25px;
}

input[type="range"] {
    width: 100%;
    accent-color: #8b5cff;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 12px;
    margin-top: 5px;
}

.play {
    width: 78px;
    height: 78px;
    margin: 25px 0;
    border: none;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 30px;
    cursor: pointer;
}

.play:active {
    transform: scale(.95);
}

.volume {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    margin-top: 18px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="player">

    <div class="cover">🎵</div>

    <!-- Change the song name here -->
    <h1>My Song</h1>
    <div class="artist">Sushant Music</div>

    <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
    >

    <div class="time">
        <span id="current">0:00</span>
        <span id="total">0:00</span>
    </div>

    <button class="play" id="playBtn">▶</button>

    <div class="volume">
        🔊
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >
    </div>

    <div class="status" id="status">
        Ready 🎵
    </div>

    <!-- IMPORTANT: song.mp3 must be beside index.html -->
    <audio id="audio" preload="metadata">
        <source src="./song.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

const current = document.getElementById("current");
const total = document.getElementById("total");
const status = document.getElementById("status");


// PLAY / PAUSE
playBtn.addEventListener("click", async () => {

    if (audio.paused) {

        try {
            await audio.play();

            playBtn.textContent = "⏸";
            status.textContent = "Playing 🎵";

        } catch (error) {

            status.textContent =
                "Song could not be loaded ❌";

            console.error(error);
        }

    } else {

        audio.pause();

        playBtn.textContent = "▶";
        status.textContent = "Paused";
    }
});


// SONG LOADED
audio.addEventListener("loadedmetadata", () => {

    total.textContent = formatTime(audio.duration);

});


// PROGRESS UPDATE
audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    current.textContent =
        formatTime(audio.currentTime);
});


// MOVE SONG USING PROGRESS BAR
progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;
});


// VOLUME
volume.addEventListener("input", () => {

    audio.volume = volume.value;
});


// SONG ENDED
audio.addEventListener("ended", () => {

    playBtn.textContent = "▶";
    progress.value = 100;
    status.textContent = "Finished 🎵";
});


// ERROR
audio.addEventListener("error", () => {

    status.textContent =
        "MP3 file not found ❌";

});


// TIME FORMAT
function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    let minutes = Math.floor(seconds / 60);
    let secs = Math.floor(seconds % 60);

    if (secs < 10) {
        secs = "0" + secs;
    }

    return minutes + ":" + secs;
}

</script>

</body>
</html>
